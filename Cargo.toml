[package]
name = "aethersafta"
version = "0.50.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-only"
description = "Real-time media compositing engine — multi-source capture, scene graph, hardware-accelerated encoding, streaming output"
homepage = "https://github.com/MacCracken/aethersafta"
repository = "https://github.com/MacCracken/aethersafta"
readme = "README.md"
keywords = ["compositing", "streaming", "capture", "video", "encoding"]
categories = ["multimedia", "multimedia::video", "multimedia::encoding"]

[features]
default = ["pipewire", "hwaccel"]
full = ["pipewire", "hwaccel", "rtmp", "srt", "openh264-enc", "openh264-dec", "vaapi", "gpu", "camera", "wayland"]
# GPU-accelerated compositing via soorat + mabda (GPU foundation)
gpu = ["dep:soorat", "dep:mabda", "dep:wgpu", "dep:pollster"]
# Audio capture and processing via dhvani
pipewire = ["dhvani/pipewire"]
# Hardware-accelerated encoding (NVENC, VA-API, QSV, AMF)
hwaccel = ["dep:ai-hwaccel"]
# H.264 software encoding via openh264
openh264-enc = ["tarang/openh264-enc"]
# H.264 software decoding via openh264
openh264-dec = ["tarang/openh264"]
# H.264 hardware encoding via VA-API (Intel/AMD)
vaapi = ["tarang/vaapi", "hwaccel"]
# V4L2 camera capture (Linux)
camera = ["dep:v4l"]
# Wayland screen capture via wlr-screencopy
wayland = ["dep:wayland-client", "dep:wayland-protocols-wlr", "dep:libc"]
# Streaming output protocols
rtmp = []
srt = []

[[bin]]
name = "aethersafta"
path = "src/main.rs"

[dependencies]
# Core
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
bytes = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Image loading (PNG, JPEG)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Image processing (color conversion, pixel format interchange)
ranga = { version = "1", default-features = false }

# Media encoding/muxing
tarang = { version = "1", default-features = false }

# Hardware detection
ai-hwaccel = { version = "1", optional = true, default-features = false }

# Audio capture, mixing, DSP, metering
dhvani = { version = "1", default-features = false, features = ["dsp", "graph"] }

# V4L2 camera capture (optional — Linux only)
v4l = { version = "0.14", optional = true }

# Wayland screen capture (optional — Linux only)
wayland-client = { version = "0.31", optional = true }
wayland-protocols-wlr = { version = "0.3", optional = true, features = ["client"] }
libc = { version = "0.2", optional = true }

# GPU-accelerated compositing (optional — soorat rendering engine + mabda GPU foundation)
soorat = { version = "1", optional = true }
mabda = { version = "1", optional = true }
wgpu = { version = "29", optional = true }
pollster = { version = "0.4", optional = true }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1"

[[bench]]
name = "compose"
harness = false

[[bench]]
name = "encode"
harness = false

[[bench]]
name = "audio"
harness = false

[[bench]]
name = "convert"
harness = false

[[bench]]
name = "latency"
harness = false

[[bench]]
name = "output"
harness = false

# Patch cros-libva for libva >= 1.23 compatibility (VP9 struct fields added upstream)
# Remove when cros-libva > 0.0.13 is released
[patch.crates-io]
cros-libva = { path = "patches/cros-libva" }
